<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Workout Tracker</title>
<link rel="manifest" id="mf" href="data:application/manifest+json,{}">
<link rel="apple-touch-icon" id="ati" href="data:,">
<link rel="stylesheet" href="app.css?v=20261002h">
</head>
<body>
<main id="app"></main>
<div id="timer" class="timer hidden">
  <span class="tmsg" id="tLab">Rest</span><span class="tt" id="tt">1:30</span>
  <div id="tActs">
    <button class="btn sm" type="button" data-a="tAdj" data-d="-15">−15</button>
    <button class="btn sm" type="button" data-a="tAdj" data-d="15">+15</button>
    <button class="btn sm" type="button" data-a="tStop">Skip</button>
  </div>
</div>
<nav id="nav"></nav>
<input type="file" id="imp" accept="application/json,.json" hidden>
<input type="file" id="phCam" accept="image/*" capture="environment" hidden>
<input type="file" id="phUp" accept="image/*" multiple hidden>
<input type="file" id="scanImg" accept="image/*,application/pdf,.pdf" hidden>
<script src="app.js?v=20261003c"></script>
</body>
</html>
